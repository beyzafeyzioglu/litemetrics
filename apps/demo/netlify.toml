# Netlify config for the standalone Live Demo app (demo.litemetrics.dev).
# Create a SECOND Netlify site from this repo with base directory = "apps/demo"
# so Netlify reads this file. The turbo filter builds the @litemetrics/core and
# @litemetrics/client workspace deps first, then the demo.
[build]
  command = "bun install && bunx turbo run build --filter @litemetrics/demo"
  publish = "dist"

[build.environment]
  NETLIFY_USE_BUN = "true"
  BUN_VERSION = "1.2.1"
  NODE_VERSION = "22"

# SPA fallback so react-router client routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Immutable cache for hashed Vite assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
